spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
server.error.include-stacktrace=never
server.error.include-message=never
researchtrace.demo.seed=false

# Task extraction mode: defaults to gemini. Set stub for offline runs, or llm for OpenAI.
task-extractor.mode=${TASK_EXTRACTOR_MODE:gemini}
task-extractor.openai.api-key=${OPENAI_API_KEY:}
task-extractor.openai.model=${OPENAI_MODEL:}
task-extractor.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# Research extraction mode: defaults to gemini. Set stub for offline runs.
research-extractor.mode=${RESEARCH_EXTRACTOR_MODE:gemini}
spring.ai.model.chat=${GEMINI_CHAT:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
