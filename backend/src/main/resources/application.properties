spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# stub (default) keeps tests and local runs offline. Set llm only when OPENAI_API_KEY and OPENAI_MODEL are available.
task-extractor.mode=${TASK_EXTRACTOR_MODE:stub}
task-extractor.openai.api-key=${OPENAI_API_KEY:}
task-extractor.openai.model=${OPENAI_MODEL:}
task-extractor.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# Research extraction is separate from task extraction. Leave GEMINI_CHAT unset (none) for tests and offline runs.
spring.ai.model.chat=${GEMINI_CHAT:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
