spring.application.name=backend

# stub (default) keeps tests and local runs offline. Set llm only when OPENAI_API_KEY and OPENAI_MODEL are available.
task-extractor.mode=${TASK_EXTRACTOR_MODE:stub}
task-extractor.openai.api-key=${OPENAI_API_KEY:}
task-extractor.openai.model=${OPENAI_MODEL:}
task-extractor.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
